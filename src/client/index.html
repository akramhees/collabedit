<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CollabEdit - Realtime Collaborative Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div id="nicknameModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Welcome to CollabEdit</h2>
        <p>Enter your nickname to start collaborating</p>
      </div>
      <div class="modal-body">
        <input type="text" id="modalNicknameInput" placeholder="Enter your nickname..." maxlength="20" value="Guest">
        <button onclick="confirmNickname()" id="modalNicknameBtn">
          <i class="fas fa-check"></i> Join
        </button>
      </div>
      <div class="modal-footer">
        <span style="color:#666;font-size:12px;">Other collaborators will see this name</span>
      </div>
    </div>
  </div>

  <div class="container" id="mainApp" style="display:none;">
    <header>
      <div class="header-left">
        <h1>CollabEdit</h1>
        <div class="room-info">
          <i class="fas fa-door-open" style="color:#9CDBD0;font-size:12px;"></i>
          <span id="roomId">default</span>
          <input type="text" id="roomInput" placeholder="Change room" style="display:none;">
          <button onclick="toggleRoomInput()" title="Edit room name">
            <i class="fas fa-pen"></i>
          </button>
        </div>
      </div>
      <div class="header-right">
        <div class="status" id="status"><i class="fas fa-circle" style="font-size:8px;margin-right:6px;"></i>Connecting...</div>
        <div class="cursor-info"><i class="fas fa-users" style="margin-right:6px;"></i><span id="cursorInfo">0</span> online</div>
        <div class="latency"><i class="fas fa-bolt" style="margin-right:4px;"></i><span id="latency">0</span>ms</div>
        <div class="user-badge"><i class="fas fa-user" style="margin-right:4px;"></i><span id="userNameDisplay">Guest</span></div>
      </div>
    </header>

    <div class="toolbar">
      <button onclick="formatText('bold')" title="Bold"><b>B</b></button>
      <button onclick="formatText('italic')" title="Italic"><i>I</i></button>
      <button onclick="formatText('underline')" title="Underline"><u>U</u></button>
      <button onclick="formatText('strikeThrough')" title="Strikethrough"><s>S</s></button>
      <span class="toolbar-separator"></span>
      <button onclick="undoAction()" title="Undo"><i class="fas fa-undo-alt"></i></button>
      <button onclick="redoAction()" title="Redo"><i class="fas fa-redo-alt"></i></button>
      <span class="toolbar-separator"></span>
      <select id="fontFamily" onchange="changeFontFamily()" title="Font family">
        <option value="Noto Sans">Noto Sans</option>
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
        <option value="Verdana">Verdana</option>
      </select>
      <input type="color" id="fontColor" value="#d4d4d4" onchange="changeFontColor()" title="Font color">
      <span class="toolbar-separator"></span>
      <button onclick="toggleDrawMode()" id="drawToggle" title="Toggle drawing mode">
        <i class="fas fa-paint-brush"></i>
      </button>
      <input type="color" id="drawColor" value="#9CDBD0" onchange="changeDrawColor()" title="Draw color">
      <select id="drawSize" onchange="changeDrawSize()" title="Draw size">
        <option value="2">Small</option>
        <option value="4" selected>Medium</option>
        <option value="8">Large</option>
        <option value="14">XL</option>
      </select>
      <button onclick="toggleEraser()" id="eraserToggle" title="Toggle eraser" style="display:none;">
        <i class="fas fa-eraser"></i>
      </button>
      <button onclick="clearDrawing()" title="Clear all drawings">
        <i class="fas fa-trash-alt"></i>
      </button>
      <span class="toolbar-separator"></span>
      <button onclick="saveDocument()" title="Save"><i class="fas fa-save"></i></button>
      <button onclick="exportDocument()" title="Export"><i class="fas fa-file-export"></i></button>
      <button onclick="clearDocument()" title="Clear all"><i class="fas fa-trash"></i></button>
    </div>

    <div id="editor-container">
      <div id="editor" contenteditable="true" spellcheck="true"></div>
      <canvas id="drawCanvas"></canvas>
    </div>

    <div id="typingIndicator"></div>

    <div class="footer">
      <div class="footer-left">
        <span><i class="fas fa-file-word" style="margin-right:4px;"></i><span id="wordCount">0</span> words</span>
        <span><i class="fas fa-font" style="margin-right:4px;"></i><span id="charCount">0</span> characters</span>
        <span><i class="fas fa-clock" style="margin-right:4px;"></i><span id="lastSaved">Never saved</span></span>
      </div>
      <div class="footer-right">
        <a href="https://github.com/akramhees" target="_blank" class="github-link">
          <i class="fab fa-github"></i>
          akramhees
        </a>
        <a href="https://github.com/akramhees/collabedit" target="_blank" class="github-link">
          <i class="fas fa-code-branch"></i>
          Fork
        </a>
      </div>
    </div>
  </div>

  <script src="/editor.js"></script>
</body>
</html>
