<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CollabEdit - Realtime Collaborative Editor</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>CollabEdit</h1>
        <div class="room-info">
          Room: <span id="roomId">default</span>
          <input type="text" id="roomInput" placeholder="Change room" style="display:none;">
          <button onclick="toggleRoomInput()" title="Edit room name">
            <i class="fas fa-pen"></i>
          </button>
        </div>
      </div>
      <div class="header-right">
        <div class="status" id="status">Connecting...</div>
        <div class="cursor-info" id="cursorInfo">0 users online</div>
        <div class="latency" id="latency">0ms</div>
      </div>
    </header>

    <div class="toolbar">
      <button onclick="formatText('bold')" title="Bold"><b>B</b></button>
      <button onclick="formatText('italic')" title="Italic"><i>I</i></button>
      <button onclick="formatText('underline')" title="Underline"><u>U</u></button>
      <button onclick="formatText('strikeThrough')" title="Strikethrough"><s>S</s></button>
      <span class="toolbar-separator"></span>
      <button onclick="undoAction()" title="Undo"><i class="fas fa-undo"></i></button>
      <button onclick="redoAction()" title="Redo"><i class="fas fa-redo"></i></button>
      <span class="toolbar-separator"></span>
      <select id="fontFamily" onchange="changeFontFamily()" title="Font family">
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
        <option value="Verdana">Verdana</option>
        <option value="Inter">Inter</option>
        <option value="JetBrains Mono">JetBrains Mono</option>
      </select>
      <input type="color" id="fontColor" value="#d4d4d4" onchange="changeFontColor()" title="Font color">
      <span class="toolbar-separator"></span>
      <button onclick="toggleDrawMode()" id="drawToggle" title="Toggle drawing mode">
        <i class="fas fa-paint-brush"></i>
      </button>
      <input type="color" id="drawColor" value="#4CAF50" onchange="changeDrawColor()" title="Draw color">
      <select id="drawSize" onchange="changeDrawSize()" title="Draw size">
        <option value="2">Small</option>
        <option value="4" selected>Medium</option>
        <option value="8">Large</option>
        <option value="14">XL</option>
      </select>
      <button onclick="clearDrawing()" title="Clear drawing">
        <i class="fas fa-eraser"></i>
      </button>
      <span class="toolbar-separator"></span>
      <button onclick="saveDocument()" title="Save"><i class="fas fa-save"></i></button>
      <button onclick="exportDocument()" title="Export"><i class="fas fa-file-export"></i></button>
      <button onclick="clearDocument()" title="Clear"><i class="fas fa-trash"></i></button>
    </div>

    <div id="editor-container">
      <div id="editor" contenteditable="true" spellcheck="true"></div>
      <canvas id="drawCanvas"></canvas>
    </div>

    <div class="footer">
      <div class="footer-left">
        <span id="wordCount">0 words</span>
        <span id="charCount">0 characters</span>
        <span id="lastSaved">Last saved: Never</span>
      </div>
      <div class="footer-right">
        <a href="https://github.com/akramhees" target="_blank" class="github-link">
          <i class="fab fa-github"></i>
          akramhees
        </a>
        <a href="https://github.com/akramhees/collabedit" target="_blank" class="github-link">
          <i class="fas fa-code-fork"></i>
          Fork on GitHub
        </a>
      </div>
    </div>
  </div>

  <script src="/editor.js"></script>
</body>
</html>
